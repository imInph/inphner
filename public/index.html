<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="blue" data-wallpaper="aurora" data-glass="full" data-logo="accent">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>inphner</title>
    <meta name="description" content="Speedcubing timer, session stats and algorithm trainer.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0d12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="inphner">
    <script>
        // Appearance before first paint, so a reload never flashes the wrong look.
        // inphner's own cache wins. Whatever inphner hasn't saved yet (theme and
        // appearance separately) is borrowed from inphub when served from localhost,
        // the same origin as inphub on XAMPP, so a first launch already matches it.
        // Every value is checked against its allowlist; a custom wallpaper URL
        // reaches CSS only as http(s) with the url()-breaking characters encoded.
        (function () {
            try {
                var h = document.documentElement, ls = window.localStorage;
                var t = ls.getItem('inphner.theme'), raw = ls.getItem('inphner.appearance');
                if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
                    if (t === null) t = ls.getItem('inphub.theme');
                    if (raw === null) raw = ls.getItem('inphub.appearance');
                }
                if (t === 'light' || t === 'dark') h.setAttribute('data-theme', t);
                var a = JSON.parse(raw || 'null');
                if (a && typeof a === 'object') {
                    var ok = function (v, list) { return typeof v === 'string' && list.indexOf(v) >= 0; };
                    if (ok(a.accent, ['blue', 'indigo', 'purple', 'pink', 'red', 'orange', 'green', 'teal', 'graphite'])) h.setAttribute('data-accent', a.accent);
                    if (ok(a.wallpaper, ['aurora', 'sunset', 'ocean', 'forest', 'graphite', 'plain', 'custom'])) h.setAttribute('data-wallpaper', a.wallpaper);
                    if (ok(a.transparency, ['full', 'reduced'])) h.setAttribute('data-glass', a.transparency);
                    if (ok(a.logo, ['accent', 'wallpaper'])) h.setAttribute('data-logo', a.logo);
                    var url = typeof a.url === 'string' ? a.url.trim() : '';
                    if (!url && typeof a.image === 'string') {
                        var m = /^url\("(https?:\/\/[^"\\]*)"\)$/i.exec(a.image);
                        if (m) url = m[1];
                    }
                    if (/^https?:\/\/\S+$/i.test(url)) {
                        h.style.setProperty('--wp-image', 'url("' + url.replace(/[\\"'()\s]/g, function (c) {
                            return '%' + ('0' + c.charCodeAt(0).toString(16).toUpperCase()).slice(-2);
                        }) + '")');
                    }
                }
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta && h.getAttribute('data-theme') === 'light') meta.setAttribute('content', '#f4f6fa');
            } catch (e) { /* storage blocked: keep the defaults above */ }
        })();
    </script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="app.css?v=4ad4f86653">
    <script type="module" src="js/main.js?v=d7326ba676"></script>
</head>
<body>
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="app">
        <aside class="sidebar" id="sidebar" aria-label="Main">
            <div class="brand"><span class="logo">inphner</span><span class="brand-version">v1.0.0</span></div>
            <nav class="nav" id="nav"></nav>
            <div class="sidebar-foot" id="sidebar-foot"></div>
        </aside>
        <div class="nav-backdrop" id="nav-backdrop" hidden
             onclick="window.inphnerDrawer&&window.inphnerDrawer(false)"></div>

        <main class="main">
            <header class="topbar" id="topbar">
                <div class="topbar-left">
                    <button class="btn btn-ghost btn-icon hamburger" id="btn-nav" aria-label="Open menu" aria-expanded="false"
                            onclick="window.inphnerDrawer&&window.inphnerDrawer()">
                        <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                    </button>
                    <div class="title-block">
                        <div class="greeting" id="greeting">&nbsp;</div>
                        <h1 class="page-title" id="page-title">Timer</h1>
                    </div>
                </div>
                <div class="topbar-right">
                    <button type="button" class="pill event-pill" id="event-pill" aria-haspopup="dialog" aria-expanded="false"
                            onclick="window.inphnerEventPicker&&window.inphnerEventPicker(this)"></button>
                    <div class="clock" id="clock" aria-label="Current time"></div>
                    <button class="btn btn-icon" id="btn-theme" title="Toggle theme" aria-label="Toggle theme"
                            onclick="window.inphnerToggleTheme&&window.inphnerToggleTheme()">
                        <svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
                    </button>
                </div>
            </header>

            <section class="view" id="view-timer" hidden aria-label="Timer"></section>
            <section class="view" id="view-sessions" hidden aria-label="Sessions"></section>
            <section class="view" id="view-stats" hidden aria-label="Stats"></section>
            <section class="view" id="view-trainer" hidden aria-label="Trainer"></section>
            <section class="view" id="view-algorithms" hidden aria-label="Algorithms"></section>
            <section class="view" id="view-tools" hidden aria-label="Tools"></section>
            <section class="view" id="view-settings" hidden aria-label="Settings"></section>
        </main>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <noscript><div class="boot-error">inphner needs JavaScript to run.</div></noscript>
    <script>
        // A module that fails to link fails silently: no view renders. Say so.
        window.addEventListener('error', function (e) {
            if (e && e.message && /module|import|export/i.test(e.message) && !window.__inphnerLoaded) {
                var b = document.createElement('div');
                b.className = 'boot-error';
                b.textContent = 'inphner could not load its scripts. Hard-reload the page (Cmd/Ctrl+Shift+R).';
                document.body.appendChild(b);
            }
        });
    </script>
</body>
</html>
